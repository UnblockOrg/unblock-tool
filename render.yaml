databases:
  - name: unblock-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: unblock-tool
    runtime: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: unblock-db
          property: connectionString
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: SLACK_CHANNEL_IDS
        sync: false
      - key: INGESTION_API_KEY
        sync: false
      - key: EMBEDDINGS_API_KEY
        sync: false
      - key: EMBEDDINGS_MODEL
        value: voyage-4
      - key: EMBEDDINGS_DIMENSION
        value: "1024"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: LOG_LEVEL
        value: INFO
